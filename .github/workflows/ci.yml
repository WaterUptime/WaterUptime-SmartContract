name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build WASM
        run: cargo build --target wasm32v1-none --release -p water_uptime

      # Test-only build used by scripts/local-archival-test.sh; never released.
      - name: Build short-ttl test WASM
        run: cargo build --target wasm32v1-none --release -p water_uptime --features short-ttl

      - name: Check scripts
        run: bash -n scripts/*.sh
